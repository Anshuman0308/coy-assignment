<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Coy</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', sans-serif;
    background: #f7f0f5;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  header {
    width: 100%;
    max-width: 480px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 20px;
    background: #fff;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
  }

  header h1 { font-size: 1.6rem; color: #e0457b; letter-spacing: 2px; }

  #matches-btn {
    background: #e0457b;
    color: #fff;
    border: none;
    border-radius: 20px;
    padding: 8px 18px;
    cursor: pointer;
    font-size: .9rem;
    font-weight: 600;
  }

  #app {
    width: 100%;
    max-width: 480px;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px;
  }

  /* ── Card stack ── */
  #card-stack {
    position: relative;
    width: 100%;
    height: 520px;
  }

  .card {
    position: absolute;
    inset: 0;
    border-radius: 20px;
    overflow: hidden;
    background: #fff;
    box-shadow: 0 8px 30px rgba(0,0,0,.12);
    cursor: grab;
    user-select: none;
    transition: transform .15s ease, opacity .15s ease;
    will-change: transform;
  }

  .card img {
    width: 100%;
    height: 320px;
    object-fit: cover;
    pointer-events: none;
  }

  .card-info { padding: 16px 20px; }
  .card-info h2 { font-size: 1.4rem; color: #222; }
  .card-info .city { color: #888; font-size: .85rem; margin: 2px 0 8px; }
  .card-info .bio { font-size: .9rem; color: #444; margin-bottom: 8px; }
  .card-info .interests { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag {
    background: #fce4ec;
    color: #e0457b;
    border-radius: 12px;
    padding: 3px 10px;
    font-size: .78rem;
    font-weight: 600;
  }

  /* stamp overlays */
  .stamp {
    position: absolute;
    top: 40px;
    font-size: 2.4rem;
    font-weight: 900;
    border: 5px solid;
    border-radius: 8px;
    padding: 4px 14px;
    opacity: 0;
    pointer-events: none;
    text-transform: uppercase;
    letter-spacing: 3px;
    transition: opacity .1s;
  }
  .stamp-like { left: 20px; color: #4caf50; border-color: #4caf50; transform: rotate(-15deg); }
  .stamp-nope { right: 20px; color: #f44336; border-color: #f44336; transform: rotate(15deg); }

  /* ── Action buttons ── */
  #actions {
    display: flex;
    gap: 32px;
    margin-top: 24px;
  }

  .action-btn {
    width: 64px; height: 64px;
    border-radius: 50%;
    border: none;
    font-size: 1.8rem;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(0,0,0,.15);
    transition: transform .15s;
  }
  .action-btn:active { transform: scale(.9); }
  #btn-pass { background: #fff; color: #f44336; }
  #btn-like { background: #e0457b; color: #fff; }

  /* ── Empty state ── */
  #empty {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    margin-top: 80px;
    color: #aaa;
    text-align: center;
  }
  #empty span { font-size: 4rem; }
  #empty p { font-size: 1.1rem; }

  /* ── Match overlay ── */
  #match-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(224,69,123,.92);
    z-index: 100;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #fff;
    text-align: center;
    padding: 32px;
  }
  #match-overlay h2 { font-size: 2.4rem; margin-bottom: 8px; }
  #match-overlay p { font-size: 1.1rem; opacity: .9; margin-bottom: 24px; }
  #match-overlay .avatars { display: flex; gap: 20px; margin-bottom: 28px; }
  #match-overlay .avatars img {
    width: 110px; height: 110px;
    border-radius: 50%;
    border: 4px solid #fff;
    object-fit: cover;
  }
  #match-overlay button {
    background: #fff;
    color: #e0457b;
    border: none;
    border-radius: 24px;
    padding: 12px 36px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
  }

  /* ── Matches view ── */
  #matches-view {
    display: none;
    width: 100%;
    flex-direction: column;
    gap: 12px;
  }
  #matches-view h2 { font-size: 1.3rem; color: #e0457b; margin-bottom: 4px; }
  .match-card {
    display: flex;
    align-items: center;
    gap: 14px;
    background: #fff;
    border-radius: 14px;
    padding: 12px 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,.07);
  }
  .match-card img { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; }
  .match-card .info h3 { font-size: 1rem; color: #222; }
  .match-card .info p { font-size: .82rem; color: #888; }

  #back-btn {
    background: none;
    border: none;
    color: #e0457b;
    font-size: .95rem;
    cursor: pointer;
    margin-bottom: 12px;
    font-weight: 600;
    align-self: flex-start;
  }

  #no-matches { color: #aaa; text-align: center; margin-top: 40px; }
</style>
</head>
<body>

<header>
  <h1>💘 Coy</h1>
  <button id="matches-btn">Matches</button>
</header>

<div id="app">
  <!-- Swipe view -->
  <div id="swipe-view" style="width:100%;display:flex;flex-direction:column;align-items:center;">
    <div id="card-stack"></div>
    <div id="actions">
      <button class="action-btn" id="btn-pass">✕</button>
      <button class="action-btn" id="btn-like">♥</button>
    </div>
    <div id="empty">
      <span>🎉</span>
      <p>You've seen everyone!<br/>Check your matches.</p>
    </div>
  </div>

  <!-- Matches view -->
  <div id="matches-view">
    <button id="back-btn">← Back to swiping</button>
    <h2>Your Matches</h2>
    <div id="matches-list"></div>
  </div>
</div>

<!-- Match overlay -->
<div id="match-overlay">
  <h2>It's a Match! 💘</h2>
  <p id="match-msg"></p>
  <div class="avatars">
    <img src="https://i.pravatar.cc/300?img=1" alt="You"/>
    <img id="match-photo" src="" alt="Match"/>
  </div>
  <button id="match-close">Keep Swiping</button>
</div>

<script>
const ME = { photo: 'https://i.pravatar.cc/300?img=1' };
let profiles = [];
let currentIdx = 0;

async function loadFeed() {
  try {
    const res = await fetch('/api/feed');
    if (!res.ok) throw new Error('Server error ' + res.status);
    profiles = await res.json();
    currentIdx = 0;
    renderCard();
  } catch (e) {
    document.getElementById('card-stack').innerHTML =
      `<div style="padding:40px;text-align:center;color:#e0457b;font-size:1rem">⚠️ Could not load profiles.<br/>${e.message}</div>`;
  }
}

function renderCard() {
  const stack = document.getElementById('card-stack');
  stack.innerHTML = '';
  const actions = document.getElementById('actions');
  const empty = document.getElementById('empty');

  if (currentIdx >= profiles.length) {
    actions.style.display = 'none';
    empty.style.display = 'flex';
    return;
  }

  actions.style.display = 'flex';
  empty.style.display = 'none';

  // Render next card (behind) for depth effect
  if (currentIdx + 1 < profiles.length) {
    const behind = buildCard(profiles[currentIdx + 1]);
    behind.style.transform = 'scale(0.95) translateY(10px)';
    behind.style.zIndex = '0';
    stack.appendChild(behind);
  }

  const card = buildCard(profiles[currentIdx]);
  card.style.zIndex = '1';
  stack.appendChild(card);
  attachDrag(card);
}

function buildCard(p) {
  const card = document.createElement('div');
  card.className = 'card';
  card.dataset.id = p.id;
  card.innerHTML = `
    <img src="${p.photo}" alt="${p.name}" draggable="false"/>
    <div class="stamp stamp-like">LIKE</div>
    <div class="stamp stamp-nope">NOPE</div>
    <div class="card-info">
      <h2>${p.name}, ${p.age}</h2>
      <div class="city">📍 ${p.city}</div>
      <div class="bio">${p.bio}</div>
      <div class="interests">${p.interests.split(',').map(i=>`<span class="tag">${i.trim()}</span>`).join('')}</div>
    </div>`;
  return card;
}

function attachDrag(card) {
  let startX = 0, startY = 0, curX = 0, dragging = false;

  const onStart = (x, y) => { startX = x; startY = y; dragging = true; card.style.transition = 'none'; };
  const onMove = (x, y) => {
    if (!dragging) return;
    curX = x - startX;
    const curY = y - startY;
    const rot = curX * 0.08;
    card.style.transform = `translate(${curX}px, ${curY}px) rotate(${rot}deg)`;
    const likeStamp = card.querySelector('.stamp-like');
    const nopeStamp = card.querySelector('.stamp-nope');
    likeStamp.style.opacity = Math.min(curX / 80, 1);
    nopeStamp.style.opacity = Math.min(-curX / 80, 1);
  };
  const onEnd = () => {
    if (!dragging) return;
    dragging = false;
    card.style.transition = 'transform .3s ease, opacity .3s ease';
    if (curX > 80) flyOut(card, 1);
    else if (curX < -80) flyOut(card, -1);
    else { card.style.transform = ''; card.querySelector('.stamp-like').style.opacity=0; card.querySelector('.stamp-nope').style.opacity=0; }
  };

  // Mouse
  card.addEventListener('mousedown', e => onStart(e.clientX, e.clientY));
  window.addEventListener('mousemove', e => onMove(e.clientX, e.clientY));
  window.addEventListener('mouseup', onEnd);

  // Touch
  card.addEventListener('touchstart', e => onStart(e.touches[0].clientX, e.touches[0].clientY), {passive:true});
  card.addEventListener('touchmove', e => onMove(e.touches[0].clientX, e.touches[0].clientY), {passive:true});
  card.addEventListener('touchend', onEnd);
}

function flyOut(card, dir) {
  card.style.transform = `translate(${dir * 600}px, 0) rotate(${dir * 30}deg)`;
  card.style.opacity = '0';
  const liked = dir === 1;
  const id = parseInt(card.dataset.id);
  setTimeout(() => { currentIdx++; renderCard(); }, 300);
  doSwipe(id, liked);
}

async function doSwipe(swipedId, liked) {
  const res = await fetch('/api/swipe', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ swipedId, liked })
  });
  const data = await res.json();
  if (data.match) showMatch(profiles.find(p => p.id === swipedId));
}

function showMatch(profile) {
  document.getElementById('match-msg').textContent = `You and ${profile.name} liked each other!`;
  document.getElementById('match-photo').src = profile.photo;
  document.getElementById('match-overlay').style.display = 'flex';
}

document.getElementById('match-close').addEventListener('click', () => {
  document.getElementById('match-overlay').style.display = 'none';
});

function getTopCard() {
  const cards = document.querySelectorAll('#card-stack .card');
  return cards[cards.length - 1] || null;
}

document.getElementById('btn-like').addEventListener('click', () => {
  const card = getTopCard();
  if (card) flyOut(card, 1);
});

document.getElementById('btn-pass').addEventListener('click', () => {
  const card = getTopCard();
  if (card) flyOut(card, -1);
});

document.getElementById('matches-btn').addEventListener('click', showMatchesView);
document.getElementById('back-btn').addEventListener('click', () => {
  document.getElementById('matches-view').style.display = 'none';
  document.getElementById('swipe-view').style.display = 'flex';
});

async function showMatchesView() {
  document.getElementById('swipe-view').style.display = 'none';
  document.getElementById('matches-view').style.display = 'flex';
  const res = await fetch('/api/matches');
  const matches = await res.json();
  const list = document.getElementById('matches-list');
  if (matches.length === 0) {
    list.innerHTML = '<p id="no-matches">No matches yet. Keep swiping! 💘</p>';
    return;
  }
  list.innerHTML = matches.map(m => `
    <div class="match-card">
      <img src="${m.photo}" alt="${m.name}"/>
      <div class="info">
        <h3>${m.name}, ${m.age}</h3>
        <p>📍 ${m.city}</p>
      </div>
    </div>`).join('');
}

loadFeed();
</script>
</body>
</html>
